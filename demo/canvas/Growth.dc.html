<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>成长记录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F66}a:hover{color:#154F49}
</style>
</helmet>
<div style="width: 390px; height: 1420px; box-sizing: border-box; background: #F3F5F2; color: #1F2A27; font-family: 'Noto Sans SC', sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 14px">

    <div>
      <h1 style="margin: 0; font-size: 26px; font-weight: 700">成长记录</h1>
      <div style="font-size: 13px; color: #5B6663; margin-top: 4px">每一次复查，都会在这里留下痕迹</div>
    </div>

    

    <div style="padding: 16px 14px 14px; border-radius: 18px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div>
          <div style="font-size: 13px; color: #5B6663">我的治疗历程</div>
          <div style="font-size: 24px; font-weight: 700">第 156 天</div>
        </div>
        <span style="font-size: 12px; color: #5B6663">自 2026.05.12 确诊</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; text-align: center">
        <div style="padding: 8px 0; border-radius: 12px; background: #F3F5F2"><div style="font-size: 18px; font-weight: 700">24</div><div style="font-size: 12px; color: #5B6663">天戴支具</div></div>
        <div style="padding: 8px 0; border-radius: 12px; background: #F3F5F2"><div style="font-size: 18px; font-weight: 700">18</div><div style="font-size: 12px; color: #5B6663">次训练</div></div>
      </div>
    </div>

    <div style="padding: 14px; border-radius: 18px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 700">Cobb 角变化</span>
        <span style="font-size: 11px; color: #5B6663; padding: 2px 8px; border-radius: 999px; background: #EDF0EE">示例数据</span>
      </div>
      <svg width="322" height="170" viewBox="0 0 322 170" role="img" aria-label="胸弯从 28 度到 27 度，腰弯从 21 度到 20 度，变化在测量误差范围内">
        <line x1="30" y1="20" x2="310" y2="20" stroke="#EEF2F0"></line>
        <line x1="30" y1="60" x2="310" y2="60" stroke="#EEF2F0"></line>
        <line x1="30" y1="100" x2="310" y2="100" stroke="#EEF2F0"></line>
        <line x1="30" y1="140" x2="310" y2="140" stroke="#DCE5E1"></line>
        <text x="4" y="24" font-size="10" fill="#5B6663">40°</text>
        <text x="4" y="64" font-size="10" fill="#5B6663">30°</text>
        <text x="4" y="104" font-size="10" fill="#5B6663">20°</text>
        <text x="4" y="144" font-size="10" fill="#5B6663">10°</text>
        <polygon points="60,48 190,52 190,92 60,88" fill="#1F6F66" opacity="0.12"></polygon>
        <line x1="60" y1="68" x2="190" y2="72" stroke="#1F6F66" stroke-width="3"></line>
        <circle cx="60" cy="68" r="5" fill="#1F6F66"></circle>
        <circle cx="190" cy="72" r="5" fill="#1F6F66"></circle>
        <text x="66" y="62" font-size="11" fill="#1F4F49" font-weight="700">胸 28°</text>
        <text x="196" y="66" font-size="11" fill="#1F4F49" font-weight="700">27°</text>
        <line x1="60" y1="96" x2="190" y2="100" stroke="#C4602A" stroke-width="3"></line>
        <circle cx="60" cy="96" r="5" fill="#C4602A"></circle>
        <circle cx="190" cy="100" r="5" fill="#C4602A"></circle>
        <text x="66" y="114" font-size="11" fill="#6B3416" font-weight="700">腰 21°</text>
        <text x="196" y="118" font-size="11" fill="#6B3416" font-weight="700">20°</text>
        <circle cx="285" cy="80" r="6" fill="none" stroke="#8A9A95" stroke-width="2" stroke-dasharray="3 3"></circle>
        <text x="60" y="162" font-size="10" fill="#5B6663" text-anchor="middle">5月</text>
        <text x="190" y="162" font-size="10" fill="#5B6663" text-anchor="middle">9月</text>
        <text x="285" y="162" font-size="10" fill="#5B6663" text-anchor="middle">11月 复查</text>
      </svg>
      <div style="padding: 10px 12px; border-radius: 10px; background: #DDEDE9; font-size: 13px; color: #1F4F49; line-height: 1.6">两次的差别在测量误差（约 ±5°）以内，可以看作<span style="font-weight: 700">保持稳定</span>。浅色带就是误差范围。具体请以医生的解读为准。</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="padding: 12px; border-radius: 16px; background: #FFFFFF">
        <div style="font-size: 12px; color: #5B6663">身高</div>
        <div style="font-size: 18px; font-weight: 700">155 cm</div>
        <div style="font-size: 12px; color: #1F6F66">4 个月 +3 cm</div>
      </div>
      <div style="padding: 12px; border-radius: 16px; background: #FFFFFF">
        <div style="font-size: 12px; color: #5B6663">骨骼成熟度</div>
        <div style="font-size: 18px; font-weight: 700">Risser 1</div>
        <div style="font-size: 12px; color: #6B3416"><br></div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Upload.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; background: #1F6F66; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">添加复查记录</a>
      <button type="button" style="min-height: 48px; border-radius: 12px; border: 1.5px solid #1F6F66; background: transparent; color: #1F6F66; font-family: inherit; font-size: 14px; font-weight: 700">生成复查前摘要</button>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 17px; font-weight: 700">复查时间线</h2>
    <sc-for list="{{ visits }}" as="v" hint-placeholder-count="2">
      <div style="display: flex; gap: 12px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 14px">
          <span style="width: 14px; height: 14px; border-radius: 999px; background: #1F6F66; margin-top: 4px"></span>
          <span style="flex: 1; width: 2px; background: #C9D4D0"></span>
        </div>
        <div style="flex: 1; margin-bottom: 10px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span style="font-size: 15px; font-weight: 700">{{ v.title }}</span>
            <span style="font-size: 12px; color: #5B6663">{{ v.date }}</span>
          </div>
          <div style="font-size: 13px; color: #2E3B37">{{ v.data }}</div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px">
            <span style="font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #EDF0EE; color: #3E4B47">{{ v.src }}</span>
            <span style="font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #EDF0EE; color: #3E4B47">{{ v.files }}</span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #DCE5E1; background: #FFFFFF; padding: 6px 0 14px">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; color: #5B6663; font-size: 11px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>今日</a>
    <a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; color: #5B6663; font-size: 11px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>训练</a>
    <a href="Growth.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; color: #1F6F66; font-size: 11px; font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"></path></svg>成长</a>
    <a href="Community.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; color: #5B6663; font-size: 11px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"></path><path d="M16 5.5a3 3 0 0 1 0 5.5M18.5 15c1.6.7 2.6 2.3 3 5"></path></svg>社群</a>
    <a href="Me.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; color: #5B6663; font-size: 11px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>我的</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
  renderVals() {
    const visits = [
      { title: '复查 · 配支具', date: '2026.09.20', data: '胸弯 27° · 腰弯 20° · 身高 155 cm · Risser 1', src: '从报告识别 · 已核对', files: '3 张照片' },
      { title: '首次诊断', date: '2026.05.12', data: 'Rigo B1 · 胸弯 28° · 腰弯 21° · 身高 152 cm', src: '从报告识别 · 已核对', files: '2 张照片' }
    ];
    return { visits };
  }
}
</script>
</body>
</html>
