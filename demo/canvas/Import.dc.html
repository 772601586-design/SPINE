<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导入运动处方</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F66}a:hover{color:#154F49}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #F3F5F2; color: #1F2A27; font-family: 'Noto Sans SC', sans-serif; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Plan.dc.html" aria-label="返回训练" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #1F2A27; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 15px; color: #5B6663">导入运动处方</span>
  </div>

  <div style="display: flex; gap: 10px; align-items: center">
    <div style="display: flex; gap: 6px">
      <div style="width: 52px; height: 70px; border-radius: 8px; background: #FFFFFF; border: 1px solid #C9D4D0; font-size: 10px; color: #5B6663; display: flex; align-items: center; justify-content: center">第 1 页</div>
      <div style="width: 52px; height: 70px; border-radius: 8px; background: #FFFFFF; border: 1px solid #C9D4D0; font-size: 10px; color: #5B6663; display: flex; align-items: center; justify-content: center">第 2 页</div>
      <div style="width: 52px; height: 70px; border-radius: 8px; background: #FFFFFF; border: 1px solid #C9D4D0; font-size: 10px; color: #5B6663; display: flex; align-items: center; justify-content: center">第 3 页</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; font-weight: 700">已拍 3 页</span>
      <button type="button" style="align-self: flex-start; min-height: 36px; padding: 0 12px; border: 1px solid #1F6F66; border-radius: 999px; background: transparent; color: #1F6F66; font-family: inherit; font-size: 13px">补拍<br><br></button>
    </div>
  </div>

  <div style="padding: 14px; border-radius: 16px; background: #1F6F66; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 18px; font-weight: 700">识别出 7 个模块、16 个动作</div>
    <div style="font-size: 13px; color: #CFE8E2">已按功能自动分类和排序 · 有 2 处需要你确认</div>
  </div>

  <div style="padding: 14px; border-radius: 16px; background: #FFFFFF; border: 2px solid #E8A87C; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; align-items: flex-start">
      <span style="padding: 2px 8px; border-radius: 6px; background: #F6DCC8; color: #6B3416; font-size: 12px; font-weight: 700; flex-shrink: 0">确认 1</span>
      <div style="font-size: 14px; line-height: 1.6"><span style="font-weight: 700">“强化运动”</span>没有找到对应的标准动作，可能是康复师的自定名称。</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{ nameOpts }}" as="o" hint-placeholder-count="2">
        <sc-if value="{{ o.on }}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-pressed="true" onClick="{{ o.pick }}" style="min-height: 44px; border-radius: 10px; border: 2px solid #1F6F66; background: #DDEDE9; color: #1F4F49; font-family: inherit; font-size: 13px; font-weight: 700">{{ o.label }}</button>
        </sc-if>
        <sc-if value="{{ o.off }}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-pressed="false" onClick="{{ o.pick }}" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9D4D0; background: transparent; color: #3E4B47; font-family: inherit; font-size: 13px">{{ o.label }}</button>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <div style="padding: 14px; border-radius: 16px; background: #FFFFFF; border: 2px solid #E8A87C; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; align-items: flex-start">
      <span style="padding: 2px 8px; border-radius: 6px; background: #F6DCC8; color: #6B3416; font-size: 12px; font-weight: 700; flex-shrink: 0">确认 2</span>
      <div style="font-size: 14px; line-height: 1.6"><span style="font-weight: 700">颈椎矫正</span>包含 7 个小动作，整套约 5 分钟。</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{ neckOpts }}" as="o" hint-placeholder-count="2">
        <sc-if value="{{ o.on }}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-pressed="true" onClick="{{ o.pick }}" style="min-height: 44px; border-radius: 10px; border: 2px solid #1F6F66; background: #DDEDE9; color: #1F4F49; font-family: inherit; font-size: 13px; font-weight: 700">{{ o.label }}</button>
        </sc-if>
        <sc-if value="{{ o.off }}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-pressed="false" onClick="{{ o.pick }}" style="min-height: 44px; border-radius: 10px; border: 1px solid #C9D4D0; background: transparent; color: #3E4B47; font-family: inherit; font-size: 13px">{{ o.label }}</button>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <div style="padding: 4px 14px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column">
    <sc-for list="{{ mods }}" as="m" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid #EEF2F0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F6F66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14px; font-weight: 700">{{ m.name }}</div>
          <div style="font-size: 12px; color: #5B6663">{{ m.detail }}</div>
        </div>
        <span style="font-size: 12px; color: #1F4F49; padding: 3px 8px; border-radius: 999px; background: #DDEDE9; flex-shrink: 0">{{ m.cat }}</span>
      </div>
    </sc-for>
  </div>

  <div style="font-size: 12px; color: #5B6663; line-height: 1.6">识别只做整理，不改变处方内容。原图会一起保存，随时可以对照。</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="Plan.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #1F6F66; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">确认导入，生成训练卡片</a>
    <button type="button" style="min-height: 44px; border: 0; background: transparent; color: #3E4B47; font-family: inherit; font-size: 14px">复诊时请康复师帮我核对</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { nameChoice: 'keep', neckChoice: 'merge' };
  }
  renderVals() {
    const n = this.state.nameChoice;
    const k = this.state.neckChoice;
    const nameOpts = [
      { id: 'keep', label: '保留康复师的叫法' },
      { id: 'search', label: '我来选标准动作' }
    ].map((o) => ({ label: o.label, on: o.id === n, off: o.id !== n, pick: () => this.setState({ nameChoice: o.id }) }));
    const neckOpts = [
      { id: 'merge', label: '合成一张卡' },
      { id: 'split', label: '拆成 7 张卡' }
    ].map((o) => ({ label: o.label, on: o.id === k, off: o.id !== k, pick: () => this.setState({ neckChoice: o.id }) }));
    const mods = [
      { name: '认知学习', detail: '画脊柱曲线图 · 每天 10 张', cat: '日常任务' },
      { name: '姿势矫正', detail: '坐姿撑桌 · 撑杆站立 3 分钟', cat: '日常任务' },
      { name: '柔韧性练习', detail: '2 个动作', cat: '柔韧' },
      { name: '3D 矫正练习', detail: '2 个动作', cat: '矫正' },
      { name: '核心 / 肩胛带稳定', detail: '5 个动作 · 隔天', cat: '力量' },
      { name: '颈椎矫正', detail: '1 套 · 约 5 分钟', cat: '矫正' },
      { name: '拉伸放松', detail: '2 个动作', cat: '放松' }
    ];
    return { nameOpts, neckOpts, mods };
  }
}
</script>
</body>
</html>
