<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>完成打卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F66}a:hover{color:#154F49}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F2; color: #1F2A27; font-family: 'Noto Sans SC', sans-serif; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 8px">
    <div style="width: 84px; height: 84px; border-radius: 999px; background: #1F6F66; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
    </div>
    <h1 style="margin: 0; font-size: 24px; font-weight: 700">今天的训练都完成了</h1>
    <div style="display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: #F6DCC8; color: #6B3416; font-size: 14px; font-weight: 700">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c4 3 6 6 6 10a6 6 0 0 1-12 0c0-4 2-7 6-10z"></path><path d="M9 12h6M9.5 15.5h5"></path></svg>
      训练 +3 松果
    </div>
  </div>

  

  <div style="padding: 14px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; font-weight: 700">本周完成度</span>
      <span style="font-size: 13px; color: #5B6663">5 / 7 天</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; color: #5B6663">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 30px; height: 30px; border-radius: 999px; background: #1F6F66"></span>一</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 30px; height: 30px; border-radius: 999px; background: #1F6F66; box-shadow: 0 0 0 3px #F6DCC8"></span>二</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 30px; height: 30px; border-radius: 999px; border: 2px dashed #C9D4D0; box-sizing: border-box"></span>三</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 30px; height: 30px; border-radius: 999px; border: 2px dashed #C9D4D0; box-sizing: border-box"></span>四</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 30px; height: 30px; border-radius: 999px; border: 2px dashed #C9D4D0; box-sizing: border-box"></span>五</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 30px; height: 30px; border-radius: 999px; border: 2px dashed #C9D4D0; box-sizing: border-box"></span>六</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 30px; height: 30px; border-radius: 999px; border: 2px dashed #C9D4D0; box-sizing: border-box"></span>日</div>
    </div>
    <div style="font-size: 12px; color: #5B6663">按周看完成度，偶尔一天没练不会清零</div>
  </div>

  <a href="Rewards.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; color: #1F2A27; text-decoration: none">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #DDEDE9; color: #1F6F66; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M9 14l-2 7 5-3 5 3-2-7"></path></svg>
    </div>
    <div style="flex: 1">
      <div style="font-size: 14px; font-weight: 700">勋章“坚持 4 周”还差 1 周</div>
      <div style="font-size: 12px; color: #5B6663">查看所有勋章和补卡</div>
    </div>
    <span style="font-size: 18px; color: #8A9A95">›</span>
  </a>

  <a href="Home.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #1F6F66; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">回到今日</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { diff: 'ok', pain: 'none' };
  }
  renderVals() {
    const diff = this.state.diff;
    const pain = this.state.pain;
    const diffs = [
      { id: 'easy', label: '轻松' },
      { id: 'ok', label: '刚好' },
      { id: 'hard', label: '有点难' }
    ].map((d) => ({ label: d.label, on: d.id === diff, off: d.id !== diff, pick: () => this.setState({ diff: d.id }) }));
    const pains = [
      { id: 'none', label: '没有' },
      { id: 'mild', label: '有一点' },
      { id: 'bad', label: '比较明显' }
    ].map((p) => ({ label: p.label, on: p.id === pain, off: p.id !== pain, pick: () => this.setState({ pain: p.id }) }));
    return { diffs, pains, showPainTip: pain !== 'none' };
  }
}
</script>
</body>
</html>
