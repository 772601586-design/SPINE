<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>添加复查记录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F66}a:hover{color:#154F49}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #F3F5F2; color: #1F2A27; font-family: 'Noto Sans SC', sans-serif; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Growth.dc.html" aria-label="返回成长记录" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #1F2A27; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 15px; color: #5B6663">添加复查记录</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">1 · 拍下医院给你的资料</h2>
    
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <div style="aspect-ratio: 3 / 4; border-radius: 10px; background: #FFFFFF; border: 1px solid #C9D4D0; font-size: 11px; color: #5B6663; display: flex; align-items: center; justify-content: center; text-align: center">影像报告</div>
      <div style="aspect-ratio: 3 / 4; border-radius: 10px; background: #FFFFFF; border: 1px solid #C9D4D0; font-size: 11px; color: #5B6663; display: flex; align-items: center; justify-content: center; text-align: center">X 光片</div>
      <div style="aspect-ratio: 3 / 4; border-radius: 10px; background: #FFFFFF; border: 1px solid #C9D4D0; font-size: 11px; color: #5B6663; display: flex; align-items: center; justify-content: center; text-align: center">检查报告</div>
      <button type="button" aria-label="再拍一张" style="aspect-ratio: 3 / 4; border-radius: 10px; border: 1.5px dashed #8A9A95; background: transparent; color: #3E4B47; font-family: inherit; font-size: 22px">+</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">2 · 核对识别出的信息</h2>
      <sc-if value="{{ viewing }}" hint-placeholder-val="{{ true }}">
        <button type="button" aria-label="编辑信息" onClick="{{ toggle }}" style="width: 44px; height: 36px; border: 0; border-radius: 999px; background: #FFFFFF; color: #3E4B47; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
        </button>
      </sc-if>
      <sc-if value="{{ editing }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ toggle }}" style="min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #1F6F66; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">完成</button>
      </sc-if>
    </div>
    <sc-for list="{{ fields }}" as="f" hint-placeholder-count="7">
      <div style="padding: 10px 12px; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 12px; color: #5B6663">{{ f.label }}</span>
          <sc-if value="{{ f.fromReport }}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #DDEDE9; color: #1F4F49">来自报告</span>
          </sc-if>
          <sc-if value="{{ f.manual }}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #EDF0EE; color: #3E4B47">手动填写</span>
          </sc-if>
        </div>
        <sc-if value="{{ viewing }}" hint-placeholder-val="{{ true }}">
          <div style="font-size: 15px; font-weight: 700; line-height: 1.5">{{ f.value }}</div>
        </sc-if>
        <sc-if value="{{ editing }}" hint-placeholder-val="{{ false }}">
          <input type="text" value="{{ f.value }}" aria-label="{{ f.label }}" style="min-height: 40px; border-radius: 8px; border: 1px solid #1F6F66; padding: 0 10px; font-family: inherit; font-size: 15px; font-weight: 700; color: #1F2A27; background: #F8FAF9">
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #EDF0EE; font-size: 12px; color: #3E4B47; line-height: 1.6">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
    <span>App 只帮你整理和对比，不做诊断。原图会一起保存，度数以原报告为准。</span>
  </div>

  <a href="Growth.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #1F6F66; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">保存到成长记录</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { editing: false };
  }
  renderVals() {
    const editing = this.state.editing;
    const f = (label, value, kind) => ({ label, value, fromReport: kind === 'r', manual: kind === 'm' });
    const fields = [
      f('复查日期', '2026 年 9 月 20 日', 'r'),
      f('胸弯 Cobb 角', '27°', 'r'),
      f('腰弯 Cobb 角', '20°', 'r'),
      f('骨骼成熟度', 'Risser 1', 'r'),
      f('医生建议', '继续佩戴支具，每天 20 小时以上，3 个月后复查', 'm'),
      f('身高', '155 cm', 'm'),
      f('医院 / 科室', '［医院名称］· 康复科', 'm')
    ];
    return { fields, editing, viewing: !editing, toggle: () => this.setState({ editing: !editing }) };
  }
}
</script>
</body>
</html>
