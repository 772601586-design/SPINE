<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>松果与勋章</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F66}a:hover{color:#154F49}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #F3F5F2; color: #1F2A27; font-family: 'Noto Sans SC', sans-serif; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Home.dc.html" aria-label="返回今日" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #1F2A27; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 15px; color: #5B6663">松果与勋章</span>
  </div>

  <div style="padding: 18px; border-radius: 20px; background: #F6DCC8; color: #6B3416; display: flex; align-items: center; gap: 14px">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c4 3 6 6 6 10a6 6 0 0 1-12 0c0-4 2-7 6-10z"></path><path d="M9 12h6M9.5 15.5h5M10 9h4"></path></svg>
    <div>
      <div style="font-size: 32px; font-weight: 700; line-height: 1.1">36 颗松果</div>
      <div style="font-size: 13px">本周已收集 11 颗</div>
    </div>
  </div>

  <div style="padding: 4px 14px; border-radius: 18px; background: #FFFFFF; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0 6px">
      <span style="font-size: 15px; font-weight: 700">今天的松果</span>
      <span style="font-size: 12px; color: #5B6663">已得 {{ gotToday }} / 可得 {{ maxToday }}</span>
    </div>
    <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-top: 1px solid #EEF2F0">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14px">{{ t.name }}</div>
          <div style="font-size: 12px; color: #5B6663">{{ t.detail }}</div>
        </div>
        <span style="font-size: 14px; font-weight: 700; color: #6B3416">{{ t.pts }}</span>
        <sc-if value="{{ t.done }}" hint-placeholder-val="{{ false }}">
          <span style="min-width: 56px; text-align: center; padding: 4px 8px; border-radius: 999px; background: #1F6F66; color: #FFFFFF; font-size: 12px; font-weight: 700">已获得</span>
        </sc-if>
        <sc-if value="{{ t.todo }}" hint-placeholder-val="{{ true }}">
          <span style="min-width: 56px; text-align: center; padding: 4px 8px; border-radius: 999px; border: 1.5px dashed #C4602A; color: #6B3416; font-size: 12px; font-weight: 700; box-sizing: border-box">待完成</span>
        </sc-if>
        <sc-if value="{{ t.later }}" hint-placeholder-val="{{ false }}">
          <span style="min-width: 56px; text-align: center; padding: 4px 8px; border-radius: 999px; background: #EDF0EE; color: #3E4B47; font-size: 12px">复查后</span>
        </sc-if>
      </div>
    </sc-for>
    <div style="font-size: 12px; color: #5B6663; padding: 6px 0 10px">支具和训练分开记录、分开得松果，一项没做到不影响另一项</div>
  </div>

  <div style="padding: 14px; border-radius: 18px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 700">补卡</span>
      <span style="font-size: 12px; color: #5B6663">每周 1 次 · 本周还剩 1 次</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #F8FAF9">
      <div style="flex: 1">
        <div style="font-size: 14px; font-weight: 700">10 月 10 日 周六 · 训练未完成</div>
        <div style="font-size: 12px; color: #5B6663">生病、考试、复查调支具，都可以补</div>
      </div>
      <button type="button" style="min-height: 38px; padding: 0 12px; border: 0; border-radius: 999px; background: #6B3416; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">10 颗补卡</button>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700">勋章</h2>
    <span style="font-size: 12px; color: #5B6663">只看坚持，不看度数</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{ medals }}" as="m" hint-placeholder-count="6">
      <div style="padding: 12px 6px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
        <sc-if value="{{ m.got }}" hint-placeholder-val="{{ true }}">
          <div style="width: 52px; height: 52px; border-radius: 999px; background: #1F6F66; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M9 14l-2 7 5-3 5 3-2-7"></path></svg>
          </div>
        </sc-if>
        <sc-if value="{{ m.wip }}" hint-placeholder-val="{{ false }}">
          <div style="width: 52px; height: 52px; border-radius: 999px; border: 3px dashed #C4602A; box-sizing: border-box; color: #6B3416; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{ m.prog }}</div>
        </sc-if>
        <sc-if value="{{ m.locked }}" hint-placeholder-val="{{ false }}">
          <div style="width: 52px; height: 52px; border-radius: 999px; background: #EDF0EE; color: #8A9A95; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          </div>
        </sc-if>
        <span style="font-size: 13px; font-weight: 700; line-height: 1.3">{{ m.name }}</span>
      </div>
    </sc-for>
  </div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (name, state, prog) => ({ name, prog: prog || '', got: state === 'got', wip: state === 'wip', locked: state === 'lock' });
    const medals = [
      m('熬过第一周', 'got'),
      m('学会 5 个动作', 'got'),
      m('第一次复查记录', 'got'),
      m('坚持 4 周', 'wip', '3/4'),
      m('支具达标 30 天', 'wip', '24/30'),
      m('训练满 30 次', 'wip', '18/30')
    ];
    const task = (name, detail, pts, state) => ({ name, detail, pts: '+' + pts, n: pts, done: state === 'done', todo: state === 'todo', later: state === 'later' });
    const tasks = [
      task('完成当天训练', '还差 8 个动作 · 4 / 12', 3, 'todo'),
      task('支具时长达标', '今天 14h40m / 20h', 2, 'todo'),
      task('复查后上传记录', '下次复查后可得', 5, 'later')
    ];
    const daily = tasks.filter((t) => !t.later);
    const gotToday = daily.filter((t) => t.done).reduce((s, t) => s + t.n, 0);
    const maxToday = daily.reduce((s, t) => s + t.n, 0);
    return { medals, tasks, gotToday: String(gotToday), maxToday: String(maxToday) };
  }
}
</script>
</body>
</html>
